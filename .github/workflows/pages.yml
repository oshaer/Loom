# PUBLISH THE WEBSITE
# Every push to the main branch publishes a website with GitHub Pages at
# https://oshaer.github.io/Loom/. Its home page is made from README.md
# (see site/build_site.py), and the browser version of Loom is at .../loom/web/.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Publish web version
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site from the README and the web version
        run: |
          pip install markdown
          python site/build_site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
